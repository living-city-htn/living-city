# Defaults for a first real run. Every key matches a field on citycnn.config.Config
# and every one can be overridden on the command line:
#   python -m citycnn.train --config configs/default.yaml --epochs 60 --backbone resnet18

# ---- data ----
data_root: data/raw
labels_csv: data/labels/labels.csv
image_size: 160          # 160 trains in minutes on CPU; 224 is better if you have a GPU
val_fraction: 0.2
test_fraction: 0.0       # raise to 0.15 once there are more than ~600 labelled images
seed: 20260919

# ---- model ----
# "scratch" is the custom net in model.py. Switch to "resnet18" to get the honest
# baseline; if scratch does not beat it, say so rather than quoting scratch alone.
backbone: scratch
width: 32
dropout: 0.2

# ---- optimisation ----
epochs: 30
batch_size: 32
lr: 0.0003
weight_decay: 0.01
warmup_epochs: 2
label_smoothing: 0.05
patience: 8
class_weight_strength: 0.7
num_workers: 0           # leave at 0 on Windows

# ---- augmentation ----
# Mild on colour on purpose: the lighting and weather heads read colour
# temperature, and a strong jitter relabels them. See transforms.py.
jitter_brightness: 0.15
jitter_contrast: 0.15
jitter_saturation: 0.10
jitter_hue: 0.02
rotation_degrees: 6.0
random_crop_scale_min: 0.7

# ---- output ----
out_dir: runs/latest
model_version: citycnn-0.1.0
